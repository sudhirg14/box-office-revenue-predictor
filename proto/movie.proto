syntax = "proto3";

package movie;

service MoviePredictionService {
  rpc PredictRevenue (MovieRequest) returns (PredictionResponse);
}

message MovieRequest {
  string genre = 1;
  float budget = 2;
  float runtime = 3;
  float imdb_rating = 4;
  int64 lamport_timestamp = 5;
}

message PredictionResponse {
  float predicted_revenue = 1;
  string message = 2;
  int64 lamport_timestamp = 3;
}

// Ricart-Agrawala Mutual Exclusion Service
service MutexService {
    rpc RequestAccess (AccessRequest) returns (AccessReply);
}

message AccessRequest {
    int32 node_id = 1;
    int64 timestamp = 2;
}

message AccessReply {
    int32 node_id = 1;
    int64 timestamp = 2;
}

// =====================================================
// Experiment 5: Deadlock Simulation and Resolution
// =====================================================

service LockService {

    rpc AcquireLock (LockRequest) returns (LockReply);

    rpc ReleaseLock (LockRequest) returns (LockReply);

}

message LockRequest {

    string resource_id = 1;

    int32 holder_id = 2;

    int32 timestamp = 3;

}

message LockReply {

    bool granted = 1;

    string message = 2;

}